<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
  <title>Inventory Exports - WMS</title>
</head>
<body>
  <div class="no-print topbar">
    <div class="nav">
      <a href="/create.html" id="navCreate">Create</a>
      <a href="/list.html" id="navList">List</a>
      <a href="/scan.html" id="navScan">Scan</a>
      <a href="/inventory.html" id="navInventory" class="active">Inventory</a>
      <a href="/settings.html" id="navSettings" style="display:none">Settings</a>
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <div class="card" style="margin-top:0">
    <h2 style="margin-bottom:12px">Báo cáo tồn kho</h2>
    <div class="row" style="gap:10px; margin-bottom:16px">
      <button onclick="load()" style="background:var(--primary); color:white">Làm mới</button>
      <button onclick="testTelegram()" style="background:white; color:var(--text); border:1.5px solid var(--border)">Test Telegram 🚀</button>
      <button onclick="notifyStale()" style="background:#fff7ed; color:#c2410c; border:1.5px solid #fed7aa">Báo cáo tồn >15 ngày ⚠️</button>
    </div>
    
    <div id="status" style="font-size:13px; color:var(--muted); font-weight:500">
      Trạng thái: Đang tải...
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <h3 style="margin-bottom:12px">Kiểm kê nhanh bằng Serial</h3>
    <form id="checkSerialForm" onsubmit="checkSerial(event)" style="display:flex; gap:10px; align-items:center; flex-wrap:wrap">
      <input type="text" id="serialInput" placeholder="Nhập Serial hoặc Package ID..." style="flex:1; min-width:200px" required autofocus />
      <button type="submit" style="background:var(--primary); color:white; height:42px; padding:0 20px">Kiểm kho</button>
    </form>
    <div id="serialResult" style="margin-top:12px; display:none; padding:12px; border-radius:var(--radius-sm)"></div>
  </div>

  <div id="box"></div>

<script>
function esc(s){
  return (s??"").toString().replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
}
async function logout(){ await fetch("/api/logout",{method:"POST"}); location.href="/login.html"; }

async function checkAuth() {
  const r = await fetch("/api/me"); const j = await r.json();
  if (j.role === 'admin' && j.user === 'tho') {
    document.getElementById("navSettings").style.display = "inline-block";
  } else if (j.role === 'entry') {
    document.getElementById("navCreate").style.display = "none";
    document.getElementById("navScan").style.display = "none";
    document.getElementById("navInventory").style.display = "none";
    location.href = "/list.html";
  }
}
checkAuth();

function setStatus(msg){ document.getElementById("status").textContent = "Trạng thái: " + msg; }

async function testTelegram() {
  if(!confirm("Gửi tin nhắn thử đến Telegram?")) return;
  const r = await fetch("/api/telegram/test", { method: "POST" });
  const j = await r.json();
  alert(j.message || j.error);
}

async function notifyStale() {
  if(!confirm("Gửi báo cáo hàng tồn lâu ngày (>15d) qua Telegram?")) return;
  const r = await fetch("/api/telegram/notify-stale-manual", { method: "POST" });
  const j = await r.json();
  alert(j.message || j.error);
}

async function load(){
  const box = document.getElementById("box");
  setStatus("Đang tải dữ liệu...");
  try{
    const r = await fetch("/api/inventory/exports");
    const res = await r.json();
    const rows = res.rows || [];
    setStatus("Tải thành công");

    if(!rows.length){
      box.innerHTML = `<div class="card" style="text-align:center; color:var(--muted)">Chưa có file export nào.</div>`;
      return;
    }

    box.innerHTML = `
      <div class="card" style="padding:0; overflow:hidden">
        <div style="padding:16px; font-weight:800; border-bottom:1px solid var(--border)">Lịch sử Export CSV</div>
        <div class="table-wrap">
          <table cellpadding="12">
            <thead>
              <tr><th>Ngày</th><th>Tên File</th><th>Người xuất</th><th style="width:100px">Thao tác</th></tr>
            </thead>
            <tbody>
              ${rows.map(x=>`
                <tr>
                  <td style="font-weight:600">${esc(x.date_key)}</td>
                  <td><a href="${esc(x.url)}" target="_blank" style="font-weight:600">${esc(x.filename)}</a></td>
                  <td style="color:var(--muted)">${esc(x.actor)}</td>
                  <td>
                    <button onclick="deleteExport(${x.id}, '${esc(x.filename)}')" style="background:#fee2e2; color:#b91c1c; padding:6px 12px; font-size:12px">Xoá</button>
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }catch(e){
    box.innerHTML = `<div class="card" style="color:#ef4444">Lỗi: ${esc(e.message)}</div>`;
  }
}

async function deleteExport(id, filename){
  if(!confirm(`Xoá vĩnh viễn file: ${filename}?`)) return;
  const r = await fetch(`/api/inventory/exports/${id}`, { method:"DELETE" });
  if(r.ok) load();
  else alert("Xoá thất bại");
}

async function checkSerial(e) {
  e.preventDefault();
  const input = document.getElementById("serialInput");
  const resultDiv = document.getElementById("serialResult");
  const val = input.value.trim();
  if (!val) return;

  resultDiv.style.display = "block";
  resultDiv.className = ""; 
  resultDiv.style.background = "#f8fafc";
  resultDiv.style.border = "1px solid var(--border)";
  resultDiv.style.color = "var(--text)";
  resultDiv.innerHTML = "<i>Đang kiểm tra...</i>";

  try {
    const r = await fetch("/api/inventory/add", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ serial: val })
    });
    const res = await r.json();

    if (r.ok) {
      const it = res.item;
      resultDiv.style.background = "#f0fdf4";
      resultDiv.style.border = "1px solid #bbf7d0";
      resultDiv.style.color = "#166534";
      resultDiv.innerHTML = `
        <div style="font-weight: 800; margin-bottom: 8px; display: flex; align-items: center; gap: 6px;">
          <span>✅</span> Kiểm kho thành công!
        </div>
        <div style="font-size: 13.5px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px;">
          <span style="color:#15803d">Sản phẩm:</span> <b>${esc(it.name)}</b>
          <span style="color:#15803d">Serial:</span> <code style="font-weight:600; font-size:12px">${esc(it.serial_clean || it.serial_raw || "-")}</code>
          <span style="color:#15803d">ID Gói:</span> <code>${esc(it.package_id || "-")}</code>
          <span style="color:#15803d">Trạng thái:</span> <span style="font-weight:600">${esc(it.status)}</span>
          <span style="color:#15803d">Phân loại:</span> <span style="text-transform: capitalize; font-weight:600">${esc(it.category || "-")}</span>
        </div>
      `;
      input.value = ""; 
      input.focus();
    } else {
      const it = res.item;
      if (res.error && res.error.includes("đã được kiểm kê")) {
        resultDiv.style.background = "#fef9c3";
        resultDiv.style.border = "1px solid #fef08a";
        resultDiv.style.color = "#854d0e";
        resultDiv.innerHTML = `
          <div style="font-weight: 800; margin-bottom: 8px; display: flex; align-items: center; gap: 6px;">
            <span>⚠️</span> ${esc(res.error)}
          </div>
          ${it ? `
          <div style="font-size: 13.5px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px;">
            <span style="color:#a16207">Sản phẩm:</span> <b>${esc(it.name)}</b>
            <span style="color:#a16207">Serial:</span> <code style="font-weight:600; font-size:12px">${esc(it.serial_clean || it.serial_raw || "-")}</code>
            <span style="color:#a16207">ID Gói:</span> <code>${esc(it.package_id || "-")}</code>
            <span style="color:#a16207">Trạng thái:</span> <span style="font-weight:600">${esc(it.status)}</span>
            <span style="color:#a16207">Phân loại:</span> <span style="text-transform: capitalize; font-weight:600">${esc(it.category || "-")}</span>
          </div>
          ` : ""}
        `;
      } else {
        resultDiv.style.background = "#fef2f2";
        resultDiv.style.border = "1px solid #fecaca";
        resultDiv.style.color = "#991b1b";
        resultDiv.innerHTML = `
          <div style="font-weight: 800; display: flex; align-items: center; gap: 6px;">
            <span>❌</span> Lỗi: ${esc(res.error || "Có lỗi xảy ra")}
          </div>
        `;
      }
    }
  } catch(e) {
    resultDiv.style.background = "#fef2f2";
    resultDiv.style.border = "1px solid #fecaca";
    resultDiv.style.color = "#991b1b";
    resultDiv.innerHTML = `
      <div style="font-weight: 800;">❌ Lỗi kết nối: ${esc(e.message)}</div>
    `;
  }
}

load();
document.getElementById("serialInput").focus();
</script>
</body>
</html>
